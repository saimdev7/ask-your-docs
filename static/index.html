<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask your document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #14202b;
    --muted: #5d6b78;
    --line: #d5dce3;
    --accent: #0f6e6b;
    --user: #1b2a3a;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .upload { display: flex; align-items: center; gap: 12px; }
  .doc-status { font-size: .85rem; color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-status.ready { color: var(--accent); font-weight: 500; }
  .doc-status.fail { color: #8a2a22; white-space: normal; }
  .btn-upload { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 9px 16px; }
  .btn-upload:hover:not(:disabled) { background: var(--bg); }
  #file { display: none; }
  header p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }

  main { flex: 1; overflow-y: auto; padding: 28px 16px 12px; }
  .thread { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

  .empty { margin: 12vh auto 0; max-width: 460px; text-align: center; color: var(--muted); }
  .empty h2 { font-family: var(--serif); font-weight: 500; font-size: 1.7rem; color: var(--ink); margin: 0 0 8px; }
  .empty p { margin: 0; line-height: 1.5; }

  .msg-user {
    align-self: flex-end;
    max-width: 85%;
    background: var(--user);
    color: #fff;
    padding: 10px 16px;
    border-radius: 18px 18px 4px 18px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg-bot {
    align-self: flex-start;
    max-width: 100%;
    padding-left: 16px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif);
    font-size: 1.12rem;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .msg-bot.loading { color: var(--muted); font-family: var(--sans); font-size: .95rem; }
  .msg-bot.error { border-left-color: #b3392f; font-family: var(--sans); font-size: .95rem; color: #8a2a22; }

  .dots::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  form { background: var(--surface); border-top: 1px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 160px;
    font: inherit; font-size: 1rem; line-height: 1.4;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: #fff; }
  body.start { justify-content: center; }
  body.start header { position: absolute; top: 0; left: 0; right: 0; }
  body.start main { flex: 0 0 auto; overflow: visible; padding: 0 16px; }
  body.start .empty { margin: 0 auto 24px; }
  body.start form { background: transparent; border-top: 0; padding: 0 16px; }
  body.start .composer { max-width: 560px; }
  body.start textarea { background: var(--surface); }

  button {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 12px; padding: 11px 20px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #0b5a57; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }
</style>
</head>
<body class="start">
  <header>
    <div>
      <h1>Ask your document</h1>
      <p>Answers come only from the document you uploaded.</p>
    </div>
    <div class="upload">
      <span class="doc-status" id="docStatus">No document yet</span>
      <input type="file" id="file" accept="application/pdf">
      <button type="button" class="btn-upload" id="uploadBtn">Upload PDF</button>
    </div>
  </header>

  <main id="scroller">
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <h2>Upload a PDF to start</h2>
        <p>Choose a PDF with the button at the top right. Once it is ready, ask anything about it.</p>
      </div>
    </div>
  </main>

  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" disabled placeholder="Upload a PDF first"  aria-label="Your question"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>

<script>
  const thread = document.getElementById("thread");
  const scroller = document.getElementById("scroller");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const empty = document.getElementById("empty");

  const fileInput = document.getElementById("file");
  const uploadBtn = document.getElementById("uploadBtn");
  const docStatus = document.getElementById("docStatus");

  function getSessionId() {
    let id = null;
    try { id = localStorage.getItem("session_id"); } catch (e) {}
    if (!id) {
      id = crypto.randomUUID();
      try { localStorage.setItem("session_id", id); } catch (e) {}
    }
    return id;
  }
  const sessionId = getSessionId();

  function setReady(name) {
    docStatus.textContent = name + " is ready";
    docStatus.className = "doc-status ready";
    input.disabled = false;
    input.placeholder = "Ask a question about your document";
    if (empty.isConnected) {
      empty.querySelector("h2").textContent = "What do you want to know?";
      empty.querySelector("p").textContent = "Type a question below. The answer is pulled from your document, not from the internet.";
    }
  }

  try {
    const saved = localStorage.getItem("doc_name");
    if (saved) setReady(saved);
  } catch (e) {}

  uploadBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    uploadBtn.disabled = true;
    input.disabled = true;
    docStatus.className = "doc-status";
    docStatus.textContent = "Reading " + file.name + "...";

    const body = new FormData();
    body.append("session_id", sessionId);
    body.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Server returned " + res.status);
      try { localStorage.setItem("doc_name", file.name); } catch (e) {}
      setReady(file.name);
    } catch (err) {
      docStatus.className = "doc-status fail";
      docStatus.textContent = "Upload failed: " + err.message + ". Choose the PDF again.";
      if (localStorage.getItem("doc_name")) input.disabled = false;
    } finally {
      uploadBtn.disabled = false;
      fileInput.value = "";
    }
  });

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    thread.appendChild(div);
    scroller.scrollTop = scroller.scrollHeight;
    return div;
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    if (empty) empty.remove();
    document.body.classList.remove("start");
    addMessage(question, "msg-user");
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;

    const pending = addMessage("Searching your document", "msg-bot loading");
    pending.insertAdjacentHTML("beforeend", '<span class="dots"></span>');

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, session_id: sessionId })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let text = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (!text) {
          pending.className = "msg-bot";
          pending.textContent = "";
        }
        text += decoder.decode(value, { stream: true });
        pending.textContent = text;
        scroller.scrollTop = scroller.scrollHeight;
      }
      if (!text) throw new Error("the server sent an empty answer");
    } catch (err) {
      pending.className = "msg-bot error";
      pending.textContent = "Could not get an answer (" + err.message + "). Check that the server is running, then send your question again.";
    } finally {
      send.disabled = false;
      input.focus();
      scroller.scrollTop = scroller.scrollHeight;
    }
  });
</script>
</body>
</html>
